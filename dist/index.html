<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17191d" />
  <title>拼豆工坊 · 图片变拼豆</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f2c84b'/%3E%3Cpath d='M9 9h6v6H9zM17 9h6v6h-6zM9 17h6v6H9zM17 17h6v6h-6z' fill='%2317191d'/%3E%3C/svg%3E" />
  <style>
    :root{--bg:#17191d;--panel:#202329;--panel2:#272b32;--line:#363b44;--text:#f4f1e9;--muted:#a8adb5;--yellow:#f2c84b;--red:#ea746b;--blue:#80b7ff;--shadow:0 24px 60px #07080a66}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 73% 0%,#353022 0,#17191d 35%),var(--bg);color:var(--text);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.01em}
    button,input{font:inherit} button{cursor:pointer}.shell{max-width:1240px;margin:0 auto;padding:28px 32px 48px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.brand{display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;border-radius:12px;background:var(--yellow);display:grid;place-items:center;color:#17191d;font-weight:900;box-shadow:0 5px 20px #f2c84b33}.brand strong{font-size:18px;letter-spacing:.08em}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:-2px}.top-actions{display:flex;gap:10px}.ghost{border:1px solid var(--line);background:#ffffff08;color:var(--text);padding:10px 15px;border-radius:10px}.ghost:hover{background:#ffffff12}
    .intro{margin-bottom:22px}.eyebrow{color:var(--yellow);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}.intro h1{font-size:clamp(30px,4vw,52px);line-height:1.05;margin:10px 0 10px;letter-spacing:-.04em}.intro p{color:var(--muted);margin:0;max-width:650px}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}.card{background:linear-gradient(145deg,#24282f,#1d2025);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stage{padding:18px}.stage-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.stage-head h2,.controls h2{font-size:16px;margin:0}.stage-head small,.hint{color:var(--muted);font-size:13px}.canvas-wrap{position:relative;min-height:500px;border-radius:13px;border:1px dashed #59606c;background-color:#1b1e23;background-image:linear-gradient(45deg,#242830 25%,transparent 25%),linear-gradient(-45deg,#242830 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#242830 75%),linear-gradient(-45deg,transparent 75%,#242830 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0;display:grid;place-items:center;overflow:hidden}.canvas-wrap.drag{border-color:var(--yellow);background-color:#302c1c}.canvas-wrap canvas{max-width:92%;max-height:92%;image-rendering:pixelated;image-rendering:crisp-edges;display:none;box-shadow:0 14px 30px #0007}.empty{display:grid;place-items:center;text-align:center;padding:30px}.upload-icon{width:68px;height:68px;border-radius:18px;background:#f2c84b18;display:grid;place-items:center;color:var(--yellow);font-size:30px;margin-bottom:16px}.empty strong{font-size:18px}.empty p{font-size:14px;color:var(--muted);margin:6px 0 18px}.upload-btn,.primary{border:0;background:var(--yellow);color:#1d1d19;border-radius:10px;padding:11px 17px;font-weight:750}.upload-btn:hover,.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}#fileInput{display:none}.stage-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:13px}.stage-foot b{color:var(--text);font-weight:600}
    .controls{padding:20px}.controls h2{margin-bottom:18px}.control{padding:15px 0;border-top:1px solid var(--line)}.control:first-of-type{border-top:0;padding-top:0}.label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.label-row label{font-weight:650}.value{color:var(--yellow);font-weight:700}.range{width:100%;accent-color:var(--yellow)}.select{width:100%;background:#17191d;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px}.toggle-row{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:14px}.toggle{appearance:none;width:38px;height:22px;border-radius:30px;background:#454b55;position:relative;cursor:pointer}.toggle:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:white;transition:.2s}.toggle:checked{background:var(--yellow)}.toggle:checked:after{left:19px}.primary{width:100%;margin-top:6px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.stat{padding:11px 12px;background:#ffffff07;border:1px solid #ffffff0b;border-radius:10px}.stat small{color:var(--muted);display:block;font-size:12px}.stat b{display:block;font-size:18px;margin-top:3px}.palette{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.swatch{width:25px;height:25px;border-radius:6px;border:2px solid #ffffff22;box-shadow:inset 0 0 0 1px #0005}.note{font-size:12px;color:var(--muted);margin-top:16px}
    @media(max-width:850px){.shell{padding:20px 16px 36px}.topbar{margin-bottom:24px}.top-actions{display:none}.workspace{grid-template-columns:1fr}.canvas-wrap{min-height:380px}.controls{order:2}.stage{order:1}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><div class="mark">✣</div><div><strong>拼豆工坊</strong><span>BEAD PIXEL STUDIO</span></div></div><div class="top-actions"><button class="ghost" id="sampleBtn">查看示例</button><button class="ghost" id="downloadBtn">导出图纸</button></div></header>
    <section class="intro"><div class="eyebrow">PHOTO → BEADS</div><h1>把灵感，变成一格一格的拼豆。</h1><p>上传一张图片，快速得到可以照着制作的像素图纸。调整尺寸、颜色数量和网格显示，找到最适合你的难度。</p></section>
    <section class="workspace">
      <div class="card stage"><div class="stage-head"><h2>预览画布</h2><small id="status">等待上传图片</small></div><div class="canvas-wrap" id="dropzone"><div class="empty" id="empty"><div class="upload-icon">↥</div><strong>拖入图片，或选择文件</strong><p>支持 JPG、PNG，建议使用主体清晰的图片</p><button class="upload-btn" id="uploadBtn">选择图片</button></div><canvas id="canvas" width="48" height="48"></canvas></div><div class="stage-foot"><span>建议先从 <b>32 × 32</b> 开始</span><span id="zoom">48 × 48 格</span></div></div>
      <aside class="card controls"><h2>生成设置</h2><div class="control"><div class="label-row"><label for="size">图纸尺寸</label><span class="value" id="sizeVal">48 × 48</span></div><input class="range" id="size" type="range" min="16" max="96" value="48" step="8"></div><div class="control"><div class="label-row"><label for="colors">颜色数量</label><span class="value" id="colorVal">12 色</span></div><input class="range" id="colors" type="range" min="4" max="24" value="12" step="1"></div><div class="control"><div class="label-row"><label for="palette">拼豆色板</label></div><select class="select" id="palette"><option>经典 24 色</option><option>柔和马卡龙</option><option>高对比霓虹</option></select></div><div class="control"><label class="toggle-row"><input class="toggle" id="grid" type="checkbox" checked> 显示网格，方便数格子</label></div><button class="primary" id="generate">生成拼豆图纸</button><div class="stats"><div class="stat"><small>预计拼豆数</small><b id="beadCount">—</b></div><div class="stat"><small>预计制作时间</small><b id="time">—</b></div></div><div class="palette"><div class="label-row"><label>使用的颜色</label><span class="hint" id="paletteCount">12 种</span></div><div class="swatches" id="swatches"></div></div><p class="note">提示：图片越简单、色块越清晰，最终拼豆效果越好。</p></aside>
    </section>
  </main>
  <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" />
  <script>
    const $=s=>document.querySelector(s), fileInput=$('#fileInput'), canvas=$('#canvas'), ctx=canvas.getContext('2d'), drop=$('#dropzone'), empty=$('#empty'); let source=null, gridOn=true;
    const colors=['#17191d','#f4f1e9','#f2c84b','#ea746b','#80b7ff','#7ed7a1','#ba8cff','#f39b57','#c98364','#59606c','#cbd5e1','#f6a6ce','#35b7aa','#e6e65b','#4b6ca8','#d65c80','#9c7b5a','#ffffff','#30343c','#a8adb5','#ffce91','#a8ddff','#95b8a0','#d7b8ff'];
    function setSource(file){if(!file)return; const img=new Image(); img.onload=()=>{source=img; $('#status').textContent='已加载 · '+file.name; draw();}; img.src=URL.createObjectURL(file)}
    function draw(){const n=+$('#size').value, palette=+$('#colors').value; canvas.width=n;canvas.height=n;canvas.style.display='block';empty.style.display='none';ctx.imageSmoothingEnabled=false;ctx.drawImage(source,0,0,n,n);const data=ctx.getImageData(0,0,n,n), p=colors.slice(0,palette); for(let i=0;i<data.data.length;i+=4){let best=p[0],bd=1e9; for(const c of p){const h=c.slice(1),r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16),d=(data.data[i]-r)**2+(data.data[i+1]-g)**2+(data.data[i+2]-b)**2;if(d<bd){bd=d;best=c}} data.data[i]=parseInt(best.slice(1,3),16);data.data[i+1]=parseInt(best.slice(3,5),16);data.data[i+2]=parseInt(best.slice(5,7),16)}ctx.putImageData(data,0,0);if(gridOn){ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=.35;for(let i=1;i<n;i++){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,n);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(n,i);ctx.stroke()}} $('#zoom').textContent=n+' × '+n+' 格';$('#beadCount').textContent=(n*n).toLocaleString();$('#time').textContent=Math.max(10,Math.round(n*n/38))+' 分钟';$('#paletteCount').textContent=palette+' 种';$('#swatches').innerHTML=p.slice(0,palette).map(c=>'<i class="swatch" style="background:'+c+'"></i>').join('')}
    $('#uploadBtn').onclick=()=>fileInput.click();fileInput.onchange=e=>setSource(e.target.files[0]);['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>setSource(e.dataTransfer.files[0]));$('#size').oninput=()=>{ $('#sizeVal').textContent=$('#size').value+' × '+$('#size').value; if(source)draw()};$('#colors').oninput=()=>{ $('#colorVal').textContent=$('#colors').value+' 色';if(source)draw()};$('#grid').onchange=e=>{gridOn=e.target.checked;if(source)draw()};$('#generate').onclick=()=>source?draw():fileInput.click();$('#sampleBtn').onclick=()=>{const c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d');x.fillStyle='#f2c84b';x.fillRect(0,0,64,64);x.fillStyle='#17191d';x.fillRect(12,12,40,40);x.fillStyle='#ea746b';x.fillRect(20,20,8,8);x.fillRect(36,20,8,8);x.fillRect(28,28,8,8);x.fillRect(20,36,8,8);x.fillRect(36,36,8,8);const img=new Image();img.onload=()=>{source=img;$('#status').textContent='示例图 · 小太阳';draw()};img.src=c.toDataURL()};$('#downloadBtn').onclick=()=>{if(!source)return fileInput.click();const a=document.createElement('a');a.download='拼豆图纸.png';a.href=canvas.toDataURL('image/png');a.click()};
  </script>
</body>
</html>
